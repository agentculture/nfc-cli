[project]
name = "nfc-cli"
version = "0.12.3"
description = "Control NFC reader-writers via USB."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

# Optional extras. The base runtime stays dependency-free (tests/test_zero_deps.py).
[project.optional-dependencies]
usb = ["pyusb>=1.2"]
mcp = ["mcp>=1.2,<2"]
all = ["pyusb>=1.2", "mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/agentculture/nfc-cli"
Issues = "https://github.com/agentculture/nfc-cli/issues"

[project.scripts]
nfc-cli = "nfc_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfc_cli"]

# The built web UI ships inside the wheel as nfc_cli/web/dist. web/dist is a
# git-ignored build artifact, so it is force-included -- by hatch_build.py
# (build_data["force_include"]) rather than a static mapping here, because a
# static force-include of a missing source aborts the build, and web/ may be
# absent (e.g. before the UI lands, or NFC_CLI_SKIP_WEB_BUILD=1 with no dist).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["nfc_cli"]
omit = ["nfc_cli/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=nfc_cli (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["nfc_cli"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
